<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link rel="stylesheet" href="contact.css">
</head>

<body>
<header>
        <nav class="navbar">
            <div class="logo">
                <li><a href="index.html"><img src="logo.jpg" alt="the logo"></a></li>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="Iced.html">ICED</a></li>
                <li><a href="hot.html">HOT</a></li>
                <li><a href="matcha.html">MATCHA</a></li>
                <li><a href="baked.html">BAKED</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-page">
        <h1>Contact Us</h1>
        <p class="contact-text">
            Have questions, recipe suggestions, or comments?
            Fill out the form below and we would love to hear from you.
        </p>
        <form class="contact-form">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname">
            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email">
            <label for="message">Questions or Comments</label>
            <textarea id="message" name="message" rows="6"></textarea>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
